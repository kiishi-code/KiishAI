<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KiishiAI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%);
    }
    .chat-container {
      scrollbar-width: thin;
      scrollbar-color: #3b82f6 #1e2937;
    }
    .chat-bubble-user {
      background: #3b82f6;
      border-radius: 20px 20px 5px 20px;
    }
    .chat-bubble-ai {
      background: #334155;
      border-radius: 20px 20px 20px 5px;
    }
    .typing {
      color: #94a3b8;
    }
  </style>

  <script>
    const SUPABASE_URL = "https://uwryzqcfirywtmpjbuwy.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV3cnl6cWNmaXJ5d3RtcGpidXd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxNDE1NDgsImV4cCI6MjA5NzcxNzU0OH0.bZxDrPuXnV4wmpOofQdeLumrZT-HR83cziOdmlLP7c8";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let userName = "User";

    async function checkAuthentication() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) {
        window.location.href = "/static/login.html"; 
      } else {
        userName = user.user_metadata.full_name || user.user_metadata.name || "Friend";
      }
    }
    checkAuthentication();
  </script>
</head>
<body class="min-h-screen text-white font-sans">
  <div class="max-w-4xl mx-auto p-4 h-screen flex flex-col">
    
    <div class="text-center py-8 border-b border-blue-900 flex justify-between items-center">
      <div class="flex-1 text-center pl-24">
        <h1 class="text-5xl font-bold bg-gradient-to-r from-blue-400 via-cyan-400 to-blue-500 bg-clip-text text-transparent">
          KiishiAI
        </h1>
        <p class="text-blue-300 mt-2 text-lg">Your Intelligent AI Companion</p>
      </div>
      <button 
        onclick="handleLogout()" 
        class="bg-slate-800 border border-slate-700 hover:bg-slate-700 text-sm px-4 py-2 rounded-xl font-medium transition-all cursor-pointer shadow-lg"
      >
        <i class="fa-solid fa-right-from-bracket mr-2"></i>Logout
      </button>
    </div>

    <div id="chat" class="flex-1 overflow-y-auto chat-container py-8 space-y-6 pr-4"></div>

    <div class="bg-slate-900 border border-blue-800 rounded-3xl p-5 shadow-2xl">
      <div class="flex gap-4">
        <input 
          id="userInput" 
          type="text" 
          class="flex-1 bg-slate-800 border border-blue-700 rounded-2xl px-6 py-5 focus:outline-none focus:border-blue-500 placeholder-gray-400 text-lg"
          placeholder="Ask me anything..."
          onkeydown="if(event.key === 'Enter') sendMessage()"
        />
        <button 
          onclick="sendMessage()"
          class="bg-blue-600 hover:bg-blue-500 w-14 h-14 rounded-2xl flex items-center justify-center transition-all active:scale-95 shadow-md"
        >
          <i class="fa-solid fa-paper-plane text-xl"></i>
        </button>
      </div>
    </div>
  </div>

<script>
  // Pull context from localStorage on startup or default empty
  let history = JSON.parse(localStorage.getItem('kiishi_chat_history')) || [];

  // Redraw persistent bubbles instantly on browser reload
  window.addEventListener('DOMContentLoaded', () => {
    if (history.length > 0) {
      history.forEach(msg => {
        const isUser = msg.role === "user";
        const text = msg.parts && msg.parts[0] ? msg.parts[0].text : msg.content;
        if (text) {
          addMessage(text, isUser);
        }
      });
    }
  });

  function addMessage(text, isUser) {
    const chat = document.getElementById('chat');
    const messageDiv = document.createElement('div');
    messageDiv.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;
    
    messageDiv.innerHTML = `
      <div class="${isUser ? 'chat-bubble-user' : 'chat-bubble-ai'} max-w-[85%] px-6 py-4 text-[17px] leading-relaxed shadow-md whitespace-pre-wrap">
        ${text}
      </div>
    `;
    chat.appendChild(messageDiv);
    chat.scrollTop = chat.scrollHeight;
  }

  async function handleLogout() {
    localStorage.removeItem('kiishi_chat_history');
    await supabaseClient.auth.signOut();
    window.location.href = "/";
  }

  async function sendMessage() {
    const input = document.getElementById('userInput');
    const message = input.value.trim();
    
    if (!message) return;

    addMessage(message, true);
    input.value = '';

    const chat = document.getElementById('chat');
    const aiDiv = document.createElement('div');
    aiDiv.className = 'flex justify-start';
    aiDiv.innerHTML = `
      <div class="chat-bubble-ai max-w-[85%] px-6 py-4 shadow-md">
        <span class="typing">KiishiAI is thinking<span class="dots">...</span></span>
      </div>
    `;
    chat.appendChild(aiDiv);
    chat.scrollTop = chat.scrollHeight;

    const bubbleContainer = aiDiv.querySelector('.chat-bubble-ai');

    try {
      const response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          message: message, 
          history: history,
          user_name: userName 
        })
      });

      if (!response.ok) throw new Error("Server error");

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let aiResponse = '';
      let isFirstChunk = true;
      let streamBuffer = ''; // Holds fragmented text pieces

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;

        // Append new network data to our buffer stream
        streamBuffer += decoder.decode(value, { stream: true });
        
        // Split data cleanly by lines
        const lines = streamBuffer.split('\n');
        
        // Save the last line back into the buffer because it might be incomplete!
        streamBuffer = lines.pop();

        for (const line of lines) {
          const trimmedLine = line.trim();
          if (trimmedLine.startsWith('data: ')) {
            const chunk = trimmedLine.slice(6);
            
            if (isFirstChunk) {
              bubbleContainer.innerHTML = '';
              isFirstChunk = false;
            }
            
            aiResponse += chunk;
            bubbleContainer.innerText = aiResponse; 
            chat.scrollTop = chat.scrollHeight;
          }
        }
      }

      // Check if anything remains in the buffer after stream closure
      if (streamBuffer.trim().startsWith('data: ')) {
        const chunk = streamBuffer.trim().slice(6);
        if (isFirstChunk) bubbleContainer.innerHTML = '';
        aiResponse += chunk;
        bubbleContainer.innerText = aiResponse;
      }

      // Save to memory history after successful completion
      history.push({ role: "user", parts: [{ text: message }] });
      history.push({ role: "model", parts: [{ text: aiResponse }] });
      localStorage.setItem('kiishi_chat_history', JSON.stringify(history));

    } catch (error) {
      console.error(error);
      bubbleContainer.innerHTML = "Sorry, I couldn't connect. Please check your system connection setup.";
    }
  }
</script>
</body>
</html>
