<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>KiishiAI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%); }
    .chat-container { scrollbar-width: thin; scrollbar-color: #3b82f6 #1e2937; }
    .chat-bubble-user { background: #3b82f6; border-radius: 18px 18px 4px 18px; }
    .chat-bubble-ai { background: #334155; border-radius: 18px 18px 18px 4px; }
    .typing { color: #94a3b8; }
  </style>
</head>
<body class="min-h-screen text-white font-sans flex flex-col justify-between overflow-hidden">
  <div class="w-full max-w-4xl mx-auto px-3 sm:px-4 h-screen flex flex-col justify-between">
    
    <div class="py-4 sm:py-6 border-b border-blue-950 flex justify-between items-center bg-transparent shrink-0">
      <div class="text-left sm:text-center sm:flex-1 sm:pl-16">
        <h1 class="text-3xl sm:text-5xl font-bold bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent">
          KiishiAI
        </h1>
        <p class="text-blue-300 text-xs sm:text-base opacity-90 hidden sm:block">Your Intelligent AI Companion</p>
      </div>
      <button onclick="handleLogout()" class="bg-slate-800 border border-slate-700 hover:bg-slate-700 text-xs sm:text-sm px-3 py-1.5 sm:px-4 sm:py-2 rounded-xl font-medium transition-all cursor-pointer shadow-md flex items-center">
        <i class="fa-solid fa-right-from-bracket mr-1.5"></i>Logout
      </button>
    </div>

    <div id="chat" class="flex-1 overflow-y-auto chat-container py-4 sm:py-6 space-y-4 pr-1"></div>

    <div class="bg-slate-900 border border-blue-900 rounded-2xl sm:rounded-3xl p-3 sm:p-4 shadow-2xl mb-3 shrink-0">
      <div class="flex gap-2 sm:gap-4">
        <input id="userInput" type="text" class="flex-1 bg-slate-800 border border-blue-800 rounded-xl sm:rounded-2xl px-4 py-3 sm:py-4 focus:outline-none focus:border-blue-500 placeholder-gray-400 text-sm sm:text-lg" placeholder="Ask me anything..." onkeydown="if(event.key === 'Enter') sendMessage()"/>
        <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-500 w-11 h-11 sm:w-14 sm:h-14 rounded-xl sm:rounded-2xl flex items-center justify-center transition-all active:scale-95 shadow-md shrink-0">
          <i class="fa-solid fa-paper-plane text-base sm:text-xl"></i>
        </button>
      </div>
    </div>
  </div>

  <script>
    // All configuration and variables declared safely inside one single global script block
    const SUPABASE_URL = "https://uwryzqcfirywtmpjbuwy.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV3cnl6cWNmaXJ5d3RtcGpidXd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxNDE1NDgsImV4cCI6MjA5NzcxNzU0OH0.bZxDrPuXnV4wmpOofQdeLumrZT-HR83cziOdmlLP7c8";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let userName = "User";
    let history = JSON.parse(localStorage.getItem('kiishi_chat_history')) || [];

    async function checkAuthentication() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) {
        window.location.href = "/static/login.html"; 
      } else {
        userName = user.user_metadata.full_name || user.user_metadata.name || "Friend";
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      checkAuthentication();
      if (history.length > 0) {
        history.forEach(msg => {
          const isUser = msg.role === "user";
          const text = msg.parts && msg.parts[0] ? msg.parts[0].text : msg.content;
          if (text) addMessage(text, isUser);
        });
      }
    });

    function addMessage(text, isUser) {
      const chat = document.getElementById('chat');
      const messageDiv = document.createElement('div');
      messageDiv.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;
      messageDiv.innerHTML = `<div class="${isUser ? 'chat-bubble-user' : 'chat-bubble-ai'} max-w-[88%] sm:max-w-[80%] px-4 py-2.5 sm:px-6 sm:py-4 text-[15px] sm:text-[17px] leading-relaxed shadow-md whitespace-pre-wrap break-words">${text}</div>`;
      chat.appendChild(messageDiv);
      chat.scrollTop = chat.scrollHeight;
    }

    async function handleLogout() {
      localStorage.removeItem('kiishi_chat_history');
      await supabaseClient.auth.signOut();
      window.location.href = "/";
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, true);
      input.value = '';

      const chat = document.getElementById('chat');
      const aiDiv = document.createElement('div');
      aiDiv.className = 'flex justify-start';
      aiDiv.innerHTML = `<div class="chat-bubble-ai max-w-[88%] sm:max-w-[80%] px-4 py-2.5 sm:px-6 sm:py-4 shadow-md"><span class="typing text-sm sm:text-base">KiishiAI is thinking<span class="dots">...</span></span></div>`;
      chat.appendChild(aiDiv);
      chat.scrollTop = chat.scrollHeight;

      const bubbleContainer = aiDiv.querySelector('.chat-bubble-ai');

      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: message, history: history, user_name: userName })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let aiResponse = '';
        let isFirstChunk = true;
        let streamBuffer = '';

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          streamBuffer += decoder.decode(value, { stream: true });
          const lines = streamBuffer.split('\n');
          streamBuffer = lines.pop();

          for (const line of lines) {
            const trimmedLine = line.trim();
            if (trimmedLine.startsWith('data: ')) {
              const chunk = trimmedLine.slice(6);
              if (isFirstChunk) { bubbleContainer.innerHTML = ''; isFirstChunk = false; }
              aiResponse += chunk;
              bubbleContainer.innerText = aiResponse; 
              chat.scrollTop = chat.scrollHeight;
            }
          }
        }
        if (streamBuffer.trim().startsWith('data: ')) {
          const chunk = streamBuffer.trim().slice(6);
          if (isFirstChunk) bubbleContainer.innerHTML = '';
          aiResponse += chunk;
          bubbleContainer.innerText = aiResponse;
        }

        history.push({ role: "user", parts: [{ text: message }] });
        history.push({ role: "model", parts: [{ text: aiResponse }] });
        localStorage.setItem('kiishi_chat_history', JSON.stringify(history));
      } catch (error) {
        bubbleContainer.innerHTML = "Sorry, I encountered a streaming connection glitch.";
      }
    }
  </script>
</body>
</html>
